name: Deploy documentation to EdgeOne Makers

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/edgeone-makers.yml'
  workflow_dispatch:

# Avoid two deployments racing when several commits are pushed in quick succession.
concurrency:
  group: edgeone-makers-docs-home-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # EdgeOne Makers is deployed through its Node.js CLI. The Docsify site is
      # already static, so no site build is needed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      # Makers deploys a whole directory rather than synchronizing to a remote
      # subdirectory. Create the desired /php path in the deployable directory.
      - name: Prepare php deployment directory
        run: |
          mkdir -p edgeone-deploy/php
          cp -a docs/. edgeone-deploy/php/

      - name: Deploy docs to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx --yes edgeone makers deploy ./edgeone-deploy -n docs-home -t "$EDGEONE_API_TOKEN" -e production
